---
# =============================================================================
# Payment Gateway
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway
  namespace: payment-testbed
  labels:
    app: payment-gateway
    component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-gateway
  template:
    metadata:
      labels:
        app: payment-gateway
        component: gateway
    spec:
      containers:
        - name: payment-gateway
          image: payment-testbed/payment-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: testbed-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "125m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

